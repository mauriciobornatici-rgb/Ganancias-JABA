name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: ganancias_jaba_test
          MARIADB_USER: jaba_test
          MARIADB_PASSWORD: jaba_test_pass
          MARIADB_ROOT_PASSWORD: root_test_pass
        ports:
          - 3317:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to isolated database
        run: npm run db:test:migrate

      - name: Seed isolated database
        run: npm run db:test:seed

      - name: Run database integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
