services:
  mysql-test:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ganancias_jaba_test
      MYSQL_USER: jaba_test
      MYSQL_PASSWORD: jaba_test_pass
      MYSQL_ROOT_PASSWORD: root_test_pass
    ports:
      - '${JABA_TEST_DB_PORT:-3317}:3306'
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./docker/mysql-test-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "jaba_test", "-pjaba_test_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_test_data:
